<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a=1
        do{
            document.write(a, '<br>');
            a++
        }while(a<=10);


        factorial=1
        number=3
        do{
            factorial=factorial*number
            number--

        }while(number>0);
        document.write(factorial)

    </script>
</body>
