<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="enter a number" id="num1">
    <input type="text" placeholder="enter a number" id="num2">
    <button onclick="handleclik('add')">add</button>
    <button onclick="handleclik('sub')">sub</button>
    <button onclick="handleclik('mul')">mul</button>
    <button onclick="handleclik('div')">div</button>
    <h2 id="result"></h2>
    <script>
        function handleclik(operation){
            let a=parseInt(document.getElementById('num1').value)
            let b=parseInt(document.getElementById('num2').value)
            let res
            if(operation=="add"){
                res=a+b;
             }else if(operation=="sub"){
                res=a-b;
             }else if(operation=="mul"){
                res=a*b;
             }else if(operation=="div"){
                res=a/b;
             }else{
                return 0
             }
             document.getElementById('result').innerHTML=res
        }
    </script>
</body>
</html>
