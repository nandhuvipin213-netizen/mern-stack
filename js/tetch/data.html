<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h3 id="res3"></h3>
    <button onclick="fetchdata()">click</button>
    <script>
        function fetchdata(){
            try{
                fetch("data.json")
                .then(res=> res.json())
                .then(data=>document.getElementById("res3").innerHTML=data.name)
            }catch(error){
                console.log("error",error);
                
            }
        }
    </script>
</body>
</html>
