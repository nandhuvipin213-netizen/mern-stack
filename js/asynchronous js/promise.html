<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let promise= new Promise((resolve, reject) => {
            let success=true
            if(success){
                resolve("data loaded")
            }
            else{
                reject("failed")
            }
        })
        console.log(promise);

        let set= new Promise((resolve, reject)=>{
            setTimeout(()=>{
                resolve("data loaded")
            },3000)
        })
        console.log(set);
        
        
    </script>
</body>
</html>
