<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function task(){
            return new Promise((reject)=>{
                setTimeout(()=>{
                    reject("task complete")
                },2000)
            })
        }
        async function runtask(){
            let res=await task();
            console.log(res);
            
            
        }
        runtask()
    </script>
</body>
