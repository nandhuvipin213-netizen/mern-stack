<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .sub{
            height: 100px;
            width: 100px;
            background-color: brown;
        }
        .main{
            height: 90px;
            width: 90px;
            background-color: blue;
            visibility: hidden;
        }
        h1{
            display: inline;
            background-color: black;

         }
         h2{
            display: inline-block ;
            width: 100px;
            height: 100px;
            background-color: blue;
         }
    </style>
</head>
<body>
    <div class="sub" visible box>haii</div>
    <div class="main" hidden box></div>
    <h1>hloo</h1>
    <h2>haii</h2>
</body>
</html>
