<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .static{
            width: 40%;
            height: 90px;
            background-color: aquamarine;
        }
        .fixed{
            position: fixed;
            border: 5px solid greenyellow;
            background-color: blueviolet;
            width: 80%;
            height: 100px;
            right: 0;
            top: 0;
        }
        .sticky{
            position: sticky;
            top: 0;
            background-color: green;

            
        }
        .ab{
            width: 80%;
            height: 100px;
            background-color: blueviolet;
            position: absolute;
            margin-top: -111px;
        }
    </style>
</head>
<body>
    <div class="static">
        <h1>static</h1>
    </div>
        <div class="ab">absolute</div>

    <div class="fixed">
        <h2>fixed</h2>
    </div>
    <div class="sticky">sticky</div>
    <p style="padding-bottom: 800px;">hloo</p>
    <div></div>
</body>
</html>
