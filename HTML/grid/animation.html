<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            animation: move 15s ease-in-out;
        }
        @keyframes move{
            from{
                transform: translateX(0px);
            }
            to{
                transform: translatex(200px);
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <img width="200px" height="170px" src="https://imgd.aeplcdn.com/1056x594/n/zp6pseb_1777219.jpg?q=80" alt="">

    </div>
</body>
</html>
