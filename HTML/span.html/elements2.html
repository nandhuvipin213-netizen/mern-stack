<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: chartreuse;
        }
        h1::after{
            content: "ii";
            color: blue;

        }
        h1::before{
            content: "in";
            color: blueviolet;
        }
        h1::first-letter{
            font-size: 50px;
            color: cadetblue;
        }
        h1::first-line{
            font-weight: bold;

        }
    </style>
</head>
<body>
    <h1>wlwcome to the world</h1>
</body>
</html>
