<!DOCTYPE html>
<html>
    <head>
        <title>List</title>
        <link rel="icon" href="https://img.freepik.com/free-photo/lavender-field-sunset-near-valensole_268835-3910.jpg?semt=ais_hybrid&w=740&q=80">
    </head>
    <body>
        <h1>ordered list</h1>
        <ol>
            <li>tea</li>
            <li>coffee</li>
        </ol>
        <h2>unordered</h2>
        <ul>
            <li>tea</li>
            <li>coffee</li>
        </ul>
        <h3>Description</h3>
        <dl>
            <dt>htms</dt>
            <dd>java</dd>
        </dl>
        <table border="10px">
            <thead>
                <th>name</th>
                <th>job</th>
                <th>emai</th>
            </thead>
            <tbody>
                <tr>
                    <td>html</td>
                    <td>java</td>
                    <td>css</td>
                    
                </tr>
                <tr>
                    <td>class</td>
                    <td>roll no</td>
                    <td>age</td>
                </tr>
            </tbody>

        </table>

    </body>
</html>
